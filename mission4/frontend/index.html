<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AI Cover Letter Generator</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <h1>AI Cover Letter Generator</h1>
      <p>
        Generate professional AI-powered cover letters instantly
      </p>
    </div>

    <!-- MAIN SECTION -->
    <div class="main">

      <!-- FORM SECTION -->
      <div class="form-container">

        <h2>Create Cover Letter</h2>

        <div class="form">

          <input
            type="text"
            id="name"
            placeholder="Your Name"
          />

          <input
            type="text"
            id="role"
            placeholder="Job Role"
          />

          <input
            type="text"
            id="company"
            placeholder="Company Name"
          />

          <input
            type="text"
            id="skills"
            placeholder="Skills (HTML, CSS, JS...)"
          />

          <textarea
            id="description"
            placeholder="Paste Job Description"
          ></textarea>

          <button id="generateBtn">
            Generate Cover Letter
          </button>

        </div>

        <!-- LOADING -->
        <div id="loading"></div>

      </div>

      <!-- OUTPUT SECTION -->
      <div class="output-container">

        <div class="output-header">
          <h2>Generated Cover Letter</h2>

          <button id="copyBtn">
            Copy
          </button>
        </div>

        <div id="output">
          Your generated cover letter will appear here...
        </div>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
